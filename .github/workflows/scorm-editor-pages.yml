name: SCORM Studio | test and publish Pages

on:
  pull_request:
    paths:
      - 'docs/editor/**'
      - 'docs/index.html'
      - 'docs/.nojekyll'
      - 'tests/scorm_editor.test.mjs'
      - 'tests/scorm_editor.browser.mjs'
      - 'tests/scorm_learner.browser.mjs'
      - 'tests/scorm_learner_harness.html'
      - 'scripts/build_scorm_pages_catalog.py'
      - 'scripts/scorm_pipeline.py'
      - 'scripts/scorm_editorial.py'
      - 'editorial/**'
      - 'raw/**'
      - '.github/workflows/scorm-editor-pages.yml'
  push:
    branches: [main]
    paths:
      - 'docs/editor/**'
      - 'docs/index.html'
      - 'docs/.nojekyll'
      - 'tests/scorm_editor.test.mjs'
      - 'tests/scorm_editor.browser.mjs'
      - 'tests/scorm_learner.browser.mjs'
      - 'tests/scorm_learner_harness.html'
      - 'scripts/build_scorm_pages_catalog.py'
      - 'scripts/scorm_pipeline.py'
      - 'scripts/scorm_editorial.py'
      - 'editorial/**'
      - 'raw/**'
      - '.github/workflows/scorm-editor-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorm-editor-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned ZIP library for tests (not published)
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund jszip@3.10.1 playwright-core@1.57.0
      - name: Validate JS and HTML source
        run: |
          node --check docs/editor/core.mjs
          node --check docs/editor/app.mjs
          test -f docs/index.html
          test -f docs/editor/index.html
          test -f docs/editor/style.css
          test -f docs/.nojekyll
      - name: Generate catalog and stage original repository ZIPs
        run: python scripts/build_scorm_pages_catalog.py --raw raw --docs docs --output build/scorm-pages
      - name: Validate generated catalog and staged sources
        run: python -m unittest discover -s tests -p 'test_scorm_pages_catalog.py' -v
      - name: Real ZIP integration tests
        run: node --test tests/scorm_editor.test.mjs
      - name: Build revised SCORM 01 exclusively for PR browser QA
        run: python scripts/scorm_pipeline.py build --course 1 --raw-dir raw --output-dir build/scorm-preview
      - name: Prepare isolated offline Rise learner preview (not published)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(build/scorm-preview/*.zip)
          test "${#packages[@]}" -eq 1
          mkdir -p build/scorm-pages/learner-preview
          unzip -qq "${packages[0]}" -d build/scorm-pages/learner-preview
          cp tests/scorm_learner_harness.html build/scorm-pages/learner-harness.html
      - name: Headless browser upload-edit-download smoke
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 8787 --bind 127.0.0.1 --directory build/scorm-pages > /tmp/scorm-editor-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node tests/scorm_editor.browser.mjs
          node tests/scorm_learner.browser.mjs
      - name: Attach editor and real Rise desktop/mobile screenshots for visual QA
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: scorm01-editor-and-rise-qa-${{ github.run_number }}
          path: |
            build/scorm-review-screenshots/
            build/scorm-learner-screenshots/
          retention-days: 7
          if-no-files-found: warn
      - name: Check repo unchanged
        run: git diff --exit-code -- docs raw files scripts
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout static site
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages library from canonical raw ZIPs
        run: python scripts/build_scorm_pages_catalog.py --raw raw --docs docs --output build/scorm-pages
      - name: Publish static editor and catalog
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/scorm-pages/
      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@v4
